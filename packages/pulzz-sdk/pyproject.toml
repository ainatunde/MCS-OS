[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulzz-sdk"
version = "0.1.0"
description = "Official Python SDK for Pulzz — African TV & FM Broadcast Intelligence, EPG & Star Rankings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Multimedia Cloud Solutions", email = "pulzz@mcsolutions.ng" }
]
maintainers = [
    { name = "MCS Identity Governance", email = "identities@mcsolutions.ng" }
]
keywords = ["broadcast", "epg", "tv-guide", "radio", "pulzz", "africa", "talent-rankings", "media-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://pulzz.stream"
Documentation = "https://pulzz.stream/docs"
Repository = "https://github.com/pulzztv/pulzz-sdk"
Tracker = "https://github.com/pulzztv/pulzz-sdk/issues"
