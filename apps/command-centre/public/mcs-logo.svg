<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" fill="none">
  <defs>
    <linearGradient id="mcs-grad-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="mcs-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="mcs-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="mcs-text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="mcs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container (Left, 48x48) -->
  <g transform="translate(2, 2)">
    <!-- Base Rounded Badge -->
    <rect width="48" height="48" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5" />
    <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />

    <!-- Broadcast Signal Waveform Accent -->
    <path d="M 12 14 C 18 9, 30 9, 36 14" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 16 17 C 20 13, 28 13, 32 17" stroke="#7C4DFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Modern M-Spine Ribbon (Left Pillar) -->
    <path d="M 11 36 L 11 20 C 11 17 14 15.5 17 17.5 L 24 23 L 20.5 27 L 16.5 23.5 L 16.5 36 Z" fill="url(#mcs-grad-left)" />

    <!-- Modern M-Spine Ribbon (Right Pillar) -->
    <path d="M 37 36 L 37 20 C 37 17 34 15.5 31 17.5 L 24 23 L 27.5 27 L 31.5 23.5 L 31.5 36 Z" fill="url(#mcs-grad-right)" />

    <!-- Autonomous Core Diamond / Quantum Decision Node -->
    <polygon points="24,24.5 28.5,29 24,33.5 19.5,29" fill="url(#mcs-grad-core)" filter="url(#mcs-glow)" opacity="0.95" />
    <circle cx="24" cy="29" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: Wordmark -->
  <g transform="translate(62, 0)">
    <!-- MCS Monogram Headline -->
    <text x="0" y="27" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5" fill="url(#mcs-text-glow)">
      MCS
    </text>

    <!-- Signal Divider Dot -->
    <circle cx="58" cy="21" r="3" fill="#00E5FF" />

    <!-- Platform Descriptor -->
    <text x="70" y="23" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" letter-spacing="1.2" fill="#38BDF8">
      PLATFORM
    </text>

    <!-- Corporate Sub-Label -->
    <text x="0" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.2" fill="#94A3B8">
      MULTIMEDIA CLOUD SOLUTIONS
    </text>
  </g>
</svg>
