<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fav-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="fav-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="fav-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="48" height="48" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1" />

  <!-- Broadcast Signal Waveform Accent -->
  <path d="M 12 14 C 18 9, 30 9, 36 14" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 16 17 C 20 13, 28 13, 32 17" stroke="#7C4DFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Modern M-Spine Ribbon (Left Pillar) -->
