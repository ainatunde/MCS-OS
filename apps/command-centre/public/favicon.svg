<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>Multimedia Cloud Solutions</title>
  <defs>
    <linearGradient id="fav-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74" />
      <stop offset="0.5" stop-color="#F97316" />
      <stop offset="1" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="fav-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED" />
      <stop offset="1" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="48" height="48" rx="12" fill="#0C0A09" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#F97316" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Broadcast signal arcs -->
  <path d="M 14 12.5 Q 24 4.5 34 12.5" stroke="#FDBA74" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 18 14 Q 24 9 30 14" stroke="#FB923C" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round" />

  <!-- M monogram -->
  <polygon points="10,40 10,19 16.5,19 24,29.5 31.5,19 38,19 38,40 32,40 32,28.5 24,39 16,28.5 16,40" fill="url(#fav-m)" />
  <polygon points="24,29.5 31.5,19 38,19 38,40 32,40 32,28.5 24,39" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Core node -->
  <polygon points="24,19 27.5,22.5 24,26 20.5,22.5" fill="url(#fav-core)" />
</svg>
