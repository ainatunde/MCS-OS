services:
  control-api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
