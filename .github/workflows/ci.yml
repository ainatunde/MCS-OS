name: MCS-OS Master CI & Assurance Qualification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qualify-acceptance-gates:
    name: Qualify Acceptance Gates (L01-L20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic fastapi httpx pyyaml sqlalchemy

      - name: Run Canonical CI Script (W01-W12 & L01-L20)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          chmod +x scripts/ci.sh
          ./scripts/ci.sh
