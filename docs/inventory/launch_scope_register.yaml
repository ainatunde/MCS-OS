# Launch Scope Register (W01)
# Governed by MCS-OS Master Specification v2.2 Section 1.3 & Section 3.3
# Defines the exact qualification classification: required | optional | not_applicable

schema_version: "2.2"
register_date: "2026-10-16T08:00:00Z"
parent_entity: "Multimedia Cloud Solutions"

shared_mandatory_controls:
  - id: "CTRL-01-IDENTITY"
    name: "Least-Privilege Database Role Segregation (8 Roles)"
    status: "required"
    verification: "tests/security/test_database_roles.py"
  - id: "CTRL-02-AUTHORIZATION"
    name: "A0-A4 Deterministic Policy Evaluation"
    status: "required"
    verification: "tests/security/test_policy_engine.py"
  - id: "CTRL-03-OUTBOX-DURABILITY"
    name: "PostgreSQL Fenced Outbox & Atomicity"
    status: "required"
    verification: "tests/integration/test_outbox_concurrency.py"
  - id: "CTRL-04-RECONCILIATION"
    name: "Outcome Unknown Quarantine & Reconciler"
    status: "required"
    verification: "tests/integration/test_reconciliation.py"
  - id: "CTRL-05-BUDGETS"
    name: "Two-Phase Budget Reservation & Circuit Breaker"
    status: "required"
    verification: "tests/integration/test_budget_accounting.py"
  - id: "CTRL-06-HALT"
    name: "Authoritative Emergency Halt & Scoped Suspension"
    status: "required"
    verification: "tests/integration/test_emergency_halts.py"
  - id: "CTRL-07-GUARDIAN"
    name: "Deterministic Watchdog & External Monitor Heartbeat"
    status: "required"
    verification: "tests/integration/test_guardian_watchdog.py"

